<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Gate Pass Dashboard</title>

    <style>

        body{
            font-family:Arial;
            background:#f2f2f2;
            margin:0;
        }

        .navbar{
            background:#2c3e50;
            padding:15px;
            display:flex;
            align-items:center;
        }

        .navbar a{
            color:white;
            margin-right:20px;
            text-decoration:none;
            font-size:18px;
        }

        .logo-text{
            color:white;
            font-size:22px;
            font-weight:bold;
            margin-right:40px;
        }

        .notification{
            margin-left:auto;
            position:relative;
        }

        .notification span{
            font-size:28px;
            color:white;
        }

        .badge{
            position:absolute;
            top:-10px;
            right:-10px;
            background:red;
            color:white;
            border-radius:50%;
            padding:4px 8px;
            font-size:12px;
        }

        .dashboard{
            display:flex;
            justify-content:center;
            gap:20px;
            margin-top:30px;
            flex-wrap:wrap;
        }

        .card{
            width:220px;
            padding:25px;
            border-radius:10px;
            color:white;
            text-align:center;
            box-shadow:0 0 10px gray;
        }

        .total{
            background:#3498db;
        }

        .approved{
            background:green;
        }

        .rejected{
            background:red;
        }

        .pending{
            background:orange;
        }

        .container{
            width:400px;
            margin:40px auto;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px gray;
        }

        .container h2{
            text-align:center;
        }

        input{
            width:100%;
            padding:12px;
            margin-top:15px;
            border:1px solid #ccc;
            border-radius:5px;
        }

        button{
            width:100%;
            padding:12px;
            background:#3498db;
            color:white;
            border:none;
            margin-top:20px;
            font-size:16px;
            border-radius:5px;
        }

        button:hover{
            background:#2980b9;
        }

    </style>

</head>
<audio id="notifySound">

<source src="https://www.soundjay.com/buttons/sounds/button-3.mp3"
        type="audio/mpeg">

</audio>
<body>

<div class="navbar">

    <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png"
         width="40"
         style="margin-right:10px;">

    <span class="logo-text">

        Gate Pass System

    </span>

    <a href="/home">Home</a>

    <a href="/visitors">Visitors</a>

    <a href="/admin">Admin</a>

    <div class="notification">

        <span>🔔</span>

        <div class="badge"
             th:text="${notification}">

        </div>

    </div>

</div>
<div id="popup"
     style="
     display:none;
     position:fixed;
     top:20px;
     right:20px;
     background:green;
     color:white;
     padding:15px 25px;
     border-radius:8px;
     z-index:9999;
     box-shadow:0 0 10px gray;">

    🔔 New Visitor Request Added

</div>
<div class="dashboard">

    <div class="card total">

        <h2>Total Visitors</h2>

        <h1 th:text="${total}"></h1>

    </div>

    <div class="card approved">

        <h2>Approved</h2>

        <h1 th:text="${approved}"></h1>

    </div>

    <div class="card rejected">

        <h2>Rejected</h2>

        <h1 th:text="${rejected}"></h1>

    </div>

    <div class="card pending">

        <h2>Pending</h2>

        <h1 th:text="${pending}"></h1>

    </div>

</div>

<div class="container">

    <h2>Add Visitor</h2>

    <form action="/submit" method="post">

        <input type="text"
               name="name"
               placeholder="Visitor Name"
               required>

        <input type="email"
               name="email"
               placeholder="Visitor Email"
               required>

        <input type="text"
               name="purpose"
               placeholder="Purpose"
               required>

        <button type="submit">

            Submit

        </button>

    </form>

</div>

<script>

setInterval(function(){

    location.reload();

}, 10000);


let oldCount =
    localStorage.getItem("notificationCount");

let newCount =
    document.querySelector(".badge")
    .innerText;

if(oldCount != null &&
   newCount > oldCount){

    document.getElementById("popup")
        .style.display = "block";

    document.getElementById("notifySound")
        .play();

    setTimeout(function(){

        document.getElementById("popup")
            .style.display = "none";

    }, 4000);
}

localStorage.setItem(
    "notificationCount",
    newCount);

setInterval(function(){

    location.reload();

}, 10000);


</script>

</body>

</html>
