<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Gate Pass Dashboard</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial,sans-serif;

            background-image:url('https://images.unsplash.com/photo-1497366754035-f200968a6e72');

            background-size:cover;

            background-position:center;

            background-attachment:fixed;
        }

        .navbar{

            background:#2c3e50;

            padding:15px 25px;

            display:flex;

            align-items:center;
        }

        .navbar a{

            color:white;

            margin-right:20px;

            text-decoration:none;

            font-size:18px;
        }

        .navbar a:hover{

            color:#3498db;
        }

        .logo-text{

            color:white;

            font-size:28px;

            font-weight:bold;

            margin-right:40px;
        }

        .notification{

            margin-left:auto;

            position:relative;
        }

        .notification span{

            font-size:30px;

            color:white;
        }

        .badge{

            position:absolute;

            top:-10px;

            right:-10px;

            background:red;

            color:white;

            border-radius:50%;

            padding:4px 8px;

            font-size:12px;
        }

        .dashboard{

            display:flex;

            justify-content:center;

            gap:20px;

            margin-top:40px;

            flex-wrap:wrap;
        }

        .card{

            width:220px;

            padding:25px;

            border-radius:15px;

            color:white;

            text-align:center;

            box-shadow:0 5px 15px rgba(0,0,0,0.3);

            transition:0.3s;
        }

        .card:hover{

            transform:translateY(-5px);
        }

        .card h2{

            margin-bottom:15px;
        }

        .card h1{

            font-size:40px;
        }

        .total{

            background:#3498db;
        }

        .approved{

            background:green;
        }

        .rejected{

            background:red;
        }

        .pending{

            background:orange;
        }

        .container{

            max-width:450px;

            width:90%;

            margin:60px auto;

            background:rgba(255,255,255,0.2);

            backdrop-filter:blur(10px);

            padding:35px;

            border-radius:20px;

            box-shadow:0 8px 25px rgba(0,0,0,0.3);
        }

        .container h2{

            text-align:center;

            margin-bottom:25px;

            font-size:36px;

            color:black;
        }

        input{

            width:100%;

            padding:14px;

            margin-top:15px;

            border:none;

            border-radius:8px;

            font-size:16px;

            outline:none;

            background:rgba(255,255,255,0.9);
        }

        button{

            width:100%;

            padding:14px;

            background:linear-gradient(45deg,#3498db,#6dd5fa);

            color:white;

            border:none;

            margin-top:20px;

            border-radius:8px;

            cursor:pointer;

            font-size:18px;

            transition:0.3s;
        }

        button:hover{

            transform:scale(1.03);
        }

        #popup{

            display:none;

            position:fixed;

            top:20px;

            right:20px;

            background:green;

            color:white;

            padding:15px 25px;

            border-radius:8px;

            z-index:9999;
        }

        #successPopup{

            position:fixed;

            top:20px;

            left:50%;

            transform:translateX(-50%);

            background:green;

            color:white;

            padding:15px 30px;

            border-radius:8px;

            z-index:9999;
        }

        @media(max-width:768px){

            .navbar{

                flex-direction:column;

                align-items:flex-start;
            }

            .navbar a{

                margin-top:10px;
            }

            .dashboard{

                flex-direction:column;

                align-items:center;
            }

            .card{

                width:85%;
            }

            .container{

                width:90%;
            }

            .logo-text{

                font-size:22px;
            }
        }

    </style>

</head>

<body>

<audio id="notifySound">

<source src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"
        type="audio/mpeg">

</audio>

<div class="navbar">

    <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png"
         width="45"
         style="margin-right:10px;">

    <span class="logo-text">

        Gate Pass System

    </span>

    <a href="/home">Home</a>

    <a href="/visitors">Visitors</a>

    <a href="/admin">Admin</a>

    <div class="notification">

        <span>🔔</span>

        <div class="badge"
             th:text="${pending}">

        </div>

    </div>

</div>

<div id="successPopup"
     th:if="${msg}">

    ✅ Visitor Added Successfully

</div>

<div id="popup">

    🔔 New Visitor Request Added

</div>

<div th:if="${param.success}"
     id="successPopup"
     style="
     position:fixed;
     top:20px;
     right:20px;
     background:green;
     color:white;
     padding:15px 25px;
     border-radius:10px;
     z-index:9999;
     box-shadow:0 0 10px gray;">

    ✅ Visitor Added Successfully

</div>

<div class="dashboard">

    <div class="card total">

        <h2>Total Visitors</h2>

        <h1 class="counter"
            th:text="${total}"></h1>

    </div>

    <div class="card approved">

        <h2>Approved</h2>

        <h1 class="counter"
            th:text="${approved}"></h1>

    </div>

    <div class="card rejected">

        <h2>Rejected</h2>

        <h1 class="counter"
            th:text="${rejected}"></h1>

    </div>

    <div class="card pending">

        <h2>Pending</h2>

        <h1 class="counter"
            th:text="${pending}"></h1>

    </div>

</div>

<div class="container">

    <h2>Add Visitor</h2>

    <form action="/submit"
          method="post">

        <input type="text"
               name="name"
               placeholder="Visitor Name"
               required>

        <input type="email"
               name="email"
               placeholder="Visitor Email"
               required>

        <input type="text"
               name="purpose"
               placeholder="Purpose"
               required>

        <button type="submit">

            Submit

        </button>

    </form>

</div>

<script>

let oldCount =
    localStorage.getItem("notificationCount");

let badge =
    document.querySelector(".badge");

if(badge){

    let newCount = badge.innerText;

    if(oldCount != null &&
       Number(newCount) > Number(oldCount)){

        document.getElementById("popup")
            .style.display = "block";

        document.getElementById("notifySound")
            .play();

        setTimeout(function(){

            document.getElementById("popup")
                .style.display = "none";

        },4000);
    }

    localStorage.setItem(
        "notificationCount",
        newCount);
}

let counters =
    document.querySelectorAll(".counter");

counters.forEach(counter => {

    let start = 0;

    let end =
        parseInt(counter.innerText);

    let count =
        setInterval(() => {

        start++;

        counter.innerText = start;

        if(start >= end){

            clearInterval(count);
        }

    },50);
});

let popup =
    document.getElementById("successPopup");

if(popup){

    setTimeout(function(){

        popup.style.display = "none";

    },3000);
}
let successPopup =
    document.getElementById("successPopup");

if(successPopup){

    setTimeout(function(){

        successPopup.style.display = "none";

    },3000);
}
</script>

</body>
</html>
