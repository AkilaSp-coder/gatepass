<!DOCTYPE html>
<html>
<head>

<title>Admin Login</title>

<style>

body{
    font-family:Arial;
    background:#f2f2f2;
}

.login-box{
    width:350px;
    margin:100px auto;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 10px gray;
}

h2{
    text-align:center;
}

input{
    width:100%;
    padding:12px;
    margin-top:15px;
}

button{
    width:100%;
    padding:12px;
    margin-top:20px;
    background:#3498db;
    color:white;
    border:none;
    font-size:16px;
}

.error{
    color:red;
    text-align:center;
}

</style>

</head>

<body>

<div class="login-box">

<h2>Admin Login</h2>

<p class="error" th:text="${error}"></p>

<form action="/admin-login" method="post">

    <input type="text"
           name="username"
           placeholder="Username"
           required>

    <input type="password"
           name="password"
           placeholder="Password"
           required>

    <button type="submit">

        Login

    </button>

</form>

</div>

</body>

</html>
