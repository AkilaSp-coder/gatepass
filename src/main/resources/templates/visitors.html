<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>



<style>

body{
    font-family:Arial;
    background:#f2f2f2;
    margin:0;
}

.navbar{
    background:#2c3e50;
    padding:15px;
}

.navbar a{
    color:white;
    text-decoration:none;
    margin-right:20px;
    font-size:18px;
}

.logo{
    color:white;
    font-size:22px;
    font-weight:bold;
    margin-right:40px;
}

table{
    width:90%;
    margin:30px auto;
    border-collapse:collapse;
    background:white;
    box-shadow:0 0 10px gray;
}

th,td{
    padding:15px;
    border:1px solid #ccc;
    text-align:center;
}

th{
    background:#3498db;
    color:white;
}

h2{
    text-align:center;
    margin-top:20px;
}

.btn-accept{
    background:green;
    color:white;
    padding:8px 15px;
    text-decoration:none;
    border-radius:5px;
}

.btn-reject{
    background:red;
    color:white;
    padding:8px 15px;
    text-decoration:none;
    border-radius:5px;
}

.popup-success{
    background:green;
    color:white;
    padding:15px;
    text-align:center;
}

.popup-reject{
    background:red;
    color:white;
    padding:15px;
    text-align:center;
}

</style>

</head>

<body>

<div th:if="${success=='approved'}"
     class="popup-success">

    Visitor Approved Successfully

</div>

<div th:if="${success=='rejected'}"
     class="popup-reject">

    Visitor Rejected Successfully

</div>

<div class="navbar">

    <span class="logo">
        Gate Pass System
    </span>

    <a href="/home">Home</a>

    <a href="/visitors">Visitors</a>

</div>

<h2>Visitors List</h2>
<div style="text-align:center;
margin-bottom:20px;">

<form action="/search" method="get">

    <input type="text"
           name="keyword"
           placeholder="Search Visitor Name"
           style="padding:10px;
           width:250px;">

    <button type="submit"
            style="padding:10px 20px;
            background:#3498db;
            color:white;
            border:none;">

        Search

    </button>

</form>

</div>

<table>

<tr>

    <th>ID</th>

    <th>Name</th>

    <th>Email</th>

    <th>Purpose</th>

    <th>Date</th>

    <th>Entry</th>

    <th>Exit</th>

    <th>Status</th>

    <th>Action</th>

</tr>
<tr th:each="v : ${list}">

    <td th:text="${v.id}"></td>

    <td th:text="${v.name}"></td>

    <td th:text="${v.email}"></td>

    <td th:text="${v.purpose}"></td>
    <td th:text="${v.visitDate}"></td>

<td th:text="${v.entryTime}"></td>

<td th:text="${v.exitTime}"></td>

    <td>

        <span th:if="${v.status=='APPROVED'}"
              style="color:green;
              font-weight:bold;">

            APPROVED

        </span>

        <span th:if="${v.status=='REJECTED'}"
              style="color:red;
              font-weight:bold;">

            REJECTED

        </span>

        <span th:if="${v.status=='PENDING'}"
              style="color:orange;
              font-weight:bold;">

            PENDING

        </span>

    </td>

    <td>

        <a class="btn-accept"
           th:href="@{/accept/{id}(id=${v.id})}">

            Accept

        </a>

        <a class="btn-reject"
           th:href="@{/reject/{id}(id=${v.id})}">

            Reject

        </a>

    </td>

</tr>

</table>

</body>

</html>
